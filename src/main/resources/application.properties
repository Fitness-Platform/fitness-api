spring.application.name=fitness-api

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:fitness}
spring.datasource.username=${POSTGRES_USER:fitness}
spring.datasource.password=${POSTGRES_PASSWORD:fitness_dev}

spring.jpa.hibernate.ddl-auto=none

security.jwt.secret=${JWT_SECRET_BASE64}
security.jwt.expiration=${JWT_EXPIRATION:PT8H}

security.auth.cookie.name=${AUTH_COOKIE_NAME:AUTH_TOKEN}
security.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
security.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

security.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:PT30M}

email.resend.api-key=${RESEND_API_KEY}
email.auth.from=${AUTH_EMAIL_FROM}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/checkout/success}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/checkout/cancel}